services:
  redis:
    image: redis:7-alpine
    container_name: starter_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: starter_backend
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - redis
